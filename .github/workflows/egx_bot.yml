name: EGX Smart SaaS Bot

on:
  schedule:
    # يعمل كل 20 دقيقة خلال أيام التداول (الأحد للخميس) من 10:00 ص إلى 2:40 م بتوقيت القاهرة (7:00 إلى 11:40 UTC)
    - cron: '*/20 7-11 * * 0-4'
  workflow_dispatch: # يتيح لك تشغيله يدوياً في أي وقت من تبويب Actions

permissions:
  contents: write # صلاحية لحفظ تحديثات المحفظة في ملف JSON تلقائياً

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run EGX Smart Engine
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Save Portfolio State to Repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "EGX SaaS Bot"
          git add egx_pro_saas_db.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update portfolio state" && git push)
