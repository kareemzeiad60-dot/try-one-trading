name: EGX Smart SaaS Bot

on:
  schedule:
    # فحص الأوامر طوال اليوم؛ main.py يحدّث السوق أثناء الجلسة ويتوقع مرة يومياً بعد الإغلاق.
    - cron: '*/20 * * * *'
  workflow_dispatch: # يتيح لك تشغيله يدوياً في أي وقت من تبويب Actions

concurrency:
  group: egx-smart-saas-bot
  cancel-in-progress: false

permissions:
  contents: write # صلاحية لحفظ تحديثات المحفظة في ملف JSON تلقائياً

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run EGX Smart Engine
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Save Portfolio State to Repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "EGX SaaS Bot"
          git add egx_pro_saas_db.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update portfolio state"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
