name: EGX Smart SaaS Bot

on:
  schedule:
    # إعادة احتياطية إذا انقطعت سلسلة التشغيلات التلقائية.
    - cron: '0 */6 * * *'
  workflow_dispatch: # يتيح لك تشغيله يدوياً في أي وقت من تبويب Actions

concurrency:
  group: egx-smart-saas-bot
  cancel-in-progress: false

permissions:
  actions: write
  contents: write # صلاحية لحفظ تحديثات المحفظة في ملف JSON تلقائياً

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run EGX Smart Engine for almost five hours
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "EGX SaaS Bot"
          deadline=$((SECONDS + 4*60*60 + 55*60))
          while (( SECONDS < deadline )); do
            cycle_started=$SECONDS
            if ! python -u main.py; then
              echo "EGX bot iteration failed; it will retry on the next poll." >&2
            fi

            git add egx_pro_saas_db.json
            if ! git diff --cached --quiet; then
              git commit -m "Update portfolio state" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi

            elapsed=$((SECONDS - cycle_started))
            sleep_for=$((1200 - elapsed))
            remaining=$((deadline - SECONDS))
            if (( sleep_for > remaining )); then
              sleep_for=$remaining
            fi
            if (( sleep_for > 0 )); then
              sleep "$sleep_for"
            fi
          done

      - name: Queue the next five-hour cycle
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --retry-delay 10 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/egx_bot.yml/dispatches" \
            --data '{"ref":"main"}'
